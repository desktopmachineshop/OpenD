<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="rule-title rule-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <title id="rule-title">One rule for release and entitlement</title>
  <desc id="rule-desc">DITA source carries product, feature and release attributes. The build applies the build-time DITAVAL once and stores a release snapshot that keeps every remaining condition. At request time the reader filter, built from the reader's products, features and version, produces one filtered view, and that view feeds navigation, pages, search, the help panel and PDF publications alike.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4a5c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="250" rx="12" fill="#ffffff"/>

  <g>
    <rect x="20" y="70" width="140" height="96" rx="8" fill="#eef3ff" stroke="#2f5bd3" stroke-width="1.5"/>
    <text x="90" y="98" text-anchor="middle" font-weight="600" fill="#14213d">DITA source</text>
    <text x="90" y="120" text-anchor="middle" fill="#3d4a5c" font-family="ui-monospace, Menlo, monospace" font-size="11">product="embed"</text>
    <text x="90" y="136" text-anchor="middle" fill="#3d4a5c" font-family="ui-monospace, Menlo, monospace" font-size="11">release="0.1.."</text>
    <text x="90" y="152" text-anchor="middle" fill="#3d4a5c" font-family="ui-monospace, Menlo, monospace" font-size="11">audience="internal"</text>
  </g>
  <g>
    <rect x="196" y="70" width="130" height="96" rx="8" fill="#e8f7ef" stroke="#13795b" stroke-width="1.5"/>
    <text x="261" y="104" text-anchor="middle" font-weight="600" fill="#14213d">Build</text>
    <text x="261" y="126" text-anchor="middle" fill="#3d4a5c">build-time</text>
    <text x="261" y="142" text-anchor="middle" fill="#3d4a5c">DITAVAL</text>
  </g>
  <g>
    <rect x="362" y="70" width="140" height="96" rx="8" fill="#fff6e5" stroke="#b45309" stroke-width="1.5"/>
    <text x="432" y="104" text-anchor="middle" font-weight="600" fill="#14213d">Release</text>
    <text x="432" y="122" text-anchor="middle" font-weight="600" fill="#14213d">snapshot</text>
    <text x="432" y="144" text-anchor="middle" fill="#3d4a5c">conditions kept</text>
  </g>
  <g>
    <rect x="538" y="20" width="200" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="638" y="44" text-anchor="middle" font-weight="600" fill="#14213d">Reader filter</text>
    <text x="638" y="62" text-anchor="middle" fill="#3d4a5c">products · features · version</text>
  </g>
  <g>
    <rect x="538" y="110" width="200" height="120" rx="8" fill="#e8f7ef" stroke="#13795b" stroke-width="2"/>
    <text x="638" y="136" text-anchor="middle" font-weight="700" fill="#14213d">One filtered view</text>
    <text x="638" y="160" text-anchor="middle" fill="#3d4a5c">navigation and pages</text>
    <text x="638" y="178" text-anchor="middle" fill="#3d4a5c">search</text>
    <text x="638" y="196" text-anchor="middle" fill="#3d4a5c">help panel and JSON API</text>
    <text x="638" y="214" text-anchor="middle" fill="#3d4a5c">PDF publications</text>
  </g>

  <g stroke="#3d4a5c" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M160,118 L194,118"/>
    <path d="M326,118 L360,118"/>
    <path d="M502,130 L536,150"/>
    <path d="M638,76 L638,108"/>
  </g>
</svg>
