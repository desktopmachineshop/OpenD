# Smallest install: the app, the build worker and Postgres.
#   node deploy/setup.mjs                # or: cp deploy/.env.example deploy/.env, then edit it
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml run --rm migrate seed /seed/seed.yaml

name: opend

x-opend: &opend
  image: opend:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgres://opend:${POSTGRES_PASSWORD:-opend}@db:5432/opend
  volumes:
    # Images and themes. A local folder on one host; S3-compatible storage later.
    - blobs:/data/blobs
    - ./seed:/seed:ro
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: opend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opend}
      POSTGRES_DB: opend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opend -d opend']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *opend
    command: ['migrate']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *opend
    command: ['serve']
    ports:
      - '${OPEND_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *opend
    command: ['worker']
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Entitlement reconcile against ENTITLEMENT_SOURCE_URL. Not started by `up`;
  # run it from cron:  docker compose -f deploy/docker-compose.yml --profile reconcile run --rm reconcile
  reconcile:
    <<: *opend
    command: ['reconcile']
    profiles: ['reconcile']
    restart: 'no'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  blobs:
