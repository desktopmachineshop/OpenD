name: Validate docs

on:
  pull_request:
  push:
    branches: [main, 'v*']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same checks as `opend preview` and the hosted build. Errors fail the job
      # and show inline on the pull request.
      - run: npx --yes @opend/cli@0 validate . --format github
