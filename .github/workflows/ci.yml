name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opend
          POSTGRES_PASSWORD: opend
          POSTGRES_DB: opend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opend -d opend_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Integration tests create a throwaway database per test file next to this one.
      TEST_DATABASE_URL: postgres://opend:opend@localhost:5432/opend_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium for the embedded-help widget test (skipped when no browser is installed).
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Validate the starter template
        run: pnpm opend validate templates/docs-starter --format github

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the hosted image
        run: docker build -f deploy/Dockerfile -t opend:ci .
      - name: Smoke-test the image
        run: docker run --rm opend:ci --help
      - name: Smoke-test PDF printing with the image's Chromium
        run: >-
          docker run --rm --entrypoint node opend:ci --input-type=module -e
          "import { createPdfRenderer } from '@opend/pdf';
          const r = createPdfRenderer();
          const pdf = await r.render('<h1>OpenD</h1>');
          await r.close();
          if (pdf.subarray(0, 4).toString() !== '%PDF') process.exit(1);
          console.log('pdf ok', pdf.length);"
